<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="icon" type="image/x-icon" href="Images/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="Images/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="Images/favicon.png">
<link rel="icon" type="image/png" sizes="48x48" href="Images/favicon.png">

<link rel="icon" type="image/png" sizes="192x192" href="Images/favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="Images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6" />
<link rel="stylesheet" href="post.css?v=6" />
</head>
<body>

  <div class="app">

    <!-- ===================== SIDEBAR (same as index.html) ===================== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-row">
          <a href="home.html" class="brand-name-link"><div class="brand-name">Tynwald</div></a>
          <button class="sidebar-collapse-toggle" id="sidebarCollapseToggle" aria-label="Collapse sidebar" title="Collapse sidebar">‹</button>
          <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">☰</button>
        </div>
        <div class="brand-tagline">KNOWLEDGE · JUSTICE · COMMUNITY</div>
      </div>

      <div class="divider"></div>

      <nav class="nav">
        <a class="nav-item" href="index.html#feed">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"></path></svg><span>Feed</span><span class="nav-dot">●</span>
        </a>
        <a class="nav-item" href="index.html#communities">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19"></path><circle cx="9" cy="8" r="3.2"></circle><path d="M20 19v-1.5a3.2 3.2 0 0 0-2.3-3.07"></path><path d="M14.5 4.3a3.2 3.2 0 0 1 0 6.2"></path></svg><span>Communities</span><span class="nav-dot">●</span>
        </a>
        <a class="nav-item" href="index.html#research">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h5.2a3.3 3.3 0 0 1 3.3 3.3V19a2.6 2.6 0 0 0-2.6-2.6H2.5z"></path><path d="M21.5 4.5h-5.2a3.3 3.3 0 0 0-3.3 3.3V19a2.6 2.6 0 0 1 2.6-2.6h5.9z"></path></svg><span>Research Hub</span><span class="nav-dot">●</span>
        </a>
        <a class="nav-item" href="index.html#library">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 18.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5V6a1.5 1.5 0 0 1 1.5-1.5h4l1.7 2.2h8.3A1.5 1.5 0 0 1 20.5 8.2z"></path></svg><span>Case Study Library</span><span class="nav-dot">●</span>
        </a>
        <a class="nav-item" href="index.html#messages">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11a7.9 7.9 0 0 1-.85 3.6A8 8 0 0 1 12.4 19a7.9 7.9 0 0 1-3.6-.85L3.5 19.5l1.35-5.3A7.9 7.9 0 0 1 4 10.6a8 8 0 0 1 4.4-7.15A7.9 7.9 0 0 1 12 2.6h.47a8 8 0 0 1 8.03 7.53z"></path></svg><span>Messages</span><span class="nav-dot">●</span>
        </a>
        <a class="nav-item" href="index.html#notifications">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 8a5.5 5.5 0 0 0-11 0c0 6.4-2.5 8.2-2.5 8.2h16S17.5 14.4 17.5 8"></path><path d="M13.9 19.4a2.2 2.2 0 0 1-3.8 0"></path></svg><span>Notifications</span><span class="nav-dot">●</span>
        </a>
        <a class="nav-item" href="index.html#profile">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20v-1.7a3.7 3.7 0 0 0-3.7-3.7H8.7A3.7 3.7 0 0 0 5 18.3V20"></path><circle cx="12" cy="7.3" r="3.7"></circle></svg><span>Profile</span><span class="nav-dot">●</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle night ops mode">
          <span class="theme-toggle-dot"></span>
          <span class="theme-toggle-label">Night Ops</span>
        </button>
        <div class="divider"></div>
        <div class="user-card">
          <div class="avatar" id="sidebarAvatar"></div>
          <div>
            <div class="user-name" id="sidebarUserName"></div>
            <div class="user-role" id="sidebarUserRole"></div>
          </div>
          <button class="logout-btn" id="logoutBtn" type="button" aria-label="Log out"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg></button>
        </div>
      </div>
    </aside>

    <!-- ===================== THREAD CONTENT ===================== -->
    <main class="content">

      <a href="index.html" class="back-link">← Back to Feed</a>

      <p id="threadLoading" class="empty-state">Loading thread...</p>

      <!-- Original post, full version -->
      <article class="thread-post hidden" id="threadPost">
        <div class="post-top">
          <span class="case-stamp" id="threadCaseId"></span>
          <span class="tag tag-outline" id="threadStatus"></span>
        </div>
        <div class="post-meta">
          <div class="thread-avatar" id="threadAvatar"></div>
          <div>
            <a href="#" class="post-author" id="threadAuthor"></a>
            <div class="post-inst" id="threadAuthorInst"></div>
          </div>
          <span class="post-time thread-time" id="threadTime"></span>
        </div>

        <h1 class="thread-title" id="threadTitle"></h1>

        <div class="thread-body" id="threadBody"></div>

        <div class="thread-actions">
          <button class="thread-action-btn like-btn" id="threadLikeBtn" data-liked="false" data-count="0"><svg class="like-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.7-10.2-9.1C.2 9.1 1 5.4 4.4 4c2.5-1 5.1 0 6.7 2.1L12 7.2l.9-1.1C14.5 4 17.1 3 19.6 4c3.4 1.4 4.2 5.1 2.6 7.9C19.5 16.3 12 21 12 21z"/></svg><span class="like-count">0</span></button>
          <span class="thread-action-btn" id="threadReplyCount">0 replies</span>
          <button type="button" class="thread-action-btn share-btn" id="threadShareBtn" title="Share"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line></svg> Share</button>
          <button type="button" class="thread-action-btn bookmark-btn" id="threadBookmarkBtn" data-saved="false" title="Save"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg> Save</button>
          <button type="button" class="thread-action-btn delete-btn hidden" id="threadDeleteBtn" title="Delete post"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg> Delete</button>
          <span class="tag tag-outline" id="threadTag" style="margin-left: auto;"></span>
        </div>
      </article>

      <!-- Reply composer -->
      <div class="reply-composer hidden" id="replyComposer">
        <div class="thread-avatar small" id="replyComposerAvatar">AO</div>
        <textarea id="replyInput" class="reply-input" placeholder="Add to the discussion..." rows="2"></textarea>
        <button id="replySubmit" class="btn-primary">Post reply</button>
      </div>

      <!-- Comment thread -->
      <div class="comment-thread hidden" id="commentThreadWrap">

        <div class="comment-section-label" id="commentCountLabel">0 replies</div>

        <div id="commentList"></div>

      </div>

    </main>
  </div>

  <!-- ===================== SHARED CONFIRM MODAL (delete actions) ===================== -->
  <div class="confirm-modal-overlay hidden" id="confirmModalOverlay">
    <div class="confirm-modal">
      <div class="confirm-modal-icon">!</div>
      <p class="confirm-modal-message" id="confirmModalMessage"></p>
      <div class="confirm-modal-actions">
        <button class="btn-ghost-inline" id="confirmModalCancel">Cancel</button>
        <button class="confirm-modal-confirm" id="confirmModalConfirm">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="config.js?v=6"></script>
  <script src="script.js?v=6"></script>

</body>
</html>
